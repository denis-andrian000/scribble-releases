# Builds Scribble from the private source repo (denis-andrian000/scribble) and publishes it here.
# Runs in this public repo so GitHub Actions is free (no minute or storage limits for public repos).
#
#  - main of the source repo  -> release vX.Y.Z (Windows installer, Android APK) + website /app/
#  - dev of the source repo   -> website /app-beta/ (test copy of the web version)
#
# It looks every 15 minutes and does nothing when everything is already up to date.
# Run it now: push a change to .github/release-request, or "Run workflow" on the Actions tab.
# Secrets: SOURCE_TOKEN (reads the private repo), ANDROID_KEYSTORE (base64), ANDROID_KEYSTORE_PASSWORD.
name: Build
on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths: ['.github/release-request', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: write      # releases and the website live in this repo
concurrency:
  group: build
  cancel-in-progress: false
env:
  SOURCE_REPO: denis-andrian000/scribble
jobs:
  # what needs doing (cheap: reads two files and the release list)
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.p.outputs.version }}
      release: ${{ steps.p.outputs.release }}
      apk: ${{ steps.p.outputs.apk }}
      web: ${{ steps.p.outputs.web }}
      main_sha: ${{ steps.p.outputs.main_sha }}
      dev_sha: ${{ steps.p.outputs.dev_sha }}
      beta: ${{ steps.p.outputs.beta }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 1 }
      - id: p
        env:
          GH_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          GH_SELF: ${{ github.token }}
        run: |
          set -e
          if [ -z "$GH_TOKEN" ]; then echo "::error::SOURCE_TOKEN secret is missing"; exit 1; fi
          main_sha=$(gh api "repos/$SOURCE_REPO/commits/main" --jq .sha)
          dev_sha=$(gh api "repos/$SOURCE_REPO/commits/dev" --jq .sha)
          v=$(gh api "repos/$SOURCE_REPO/contents/package.json?ref=$main_sha" --jq .content | base64 -d | jq -r .version)
          assets=$(GH_TOKEN=$GH_SELF gh release view "v$v" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name] | join(",")' 2>/dev/null || true)
          release=true; apk=true
          [[ ",$assets," == *",latest.yml,"* && ",$assets," == *",Scribble-Setup-$v.exe,"* ]] && release=false
          [[ ",$assets," == *",Scribble-$v.apk,"* && ",$assets," == *",Scribble-Android.apk,"* ]] && apk=false
          web=true;  [ "$(cat app/.source-sha 2>/dev/null)" = "$main_sha" ] && web=false
          beta=true; [ "$(cat app-beta/.source-sha 2>/dev/null)" = "$dev_sha" ] && beta=false
          echo "v$v release=$release apk=$apk web=$web beta=$beta (main ${main_sha::7}, dev ${dev_sha::7})"
          { echo "version=$v"; echo "release=$release"; echo "apk=$apk"; echo "web=$web"; echo "beta=$beta"
            echo "main_sha=$main_sha"; echo "dev_sha=$dev_sha"; } >> "$GITHUB_OUTPUT"

  windows:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: windows-latest
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v5
        with: { repository: denis-andrian000/scribble, ref: '${{ needs.plan.outputs.main_sha }}', token: '${{ secrets.SOURCE_TOKEN }}' }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build installer
        run: npx electron-builder --win nsis --publish never
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.plan.outputs.version }}
          R: ${{ github.repository }}
        run: |
          set -e
          ls -la dist
          # release notes = this version's section of CHANGELOG.md
          awk -v v="$V" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          if gh release view "v$V" --repo "$R" >/dev/null 2>&1; then
            gh release edit "v$V" --repo "$R" --title "Scribble $V" --notes-file notes.md
          else
            gh release create "v$V" --repo "$R" --title "Scribble $V" --notes-file notes.md
          fi
          # installer first, update info last: installed copies only see a release once everything is there
          for f in "dist/Scribble-Setup-$V.exe" "dist/Scribble-Setup-$V.exe.blockmap" "dist/latest.yml"; do
            ok=0
            for try in 1 2 3 4 5; do
              if gh release upload "v$V" "$f" --repo "$R" --clobber; then ok=1; break; fi
              echo "upload of $f failed (try $try), retrying…"; sleep $((try * 15))
            done
            [ $ok = 1 ] || { echo "::error::Could not upload $f"; exit 1; }
          done

  android:
    needs: [plan, windows]     # the release page exists by then
    if: always() && needs.plan.outputs.apk == 'true' && needs.windows.result != 'failure' && needs.windows.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { repository: denis-andrian000/scribble, ref: '${{ needs.plan.outputs.main_sha }}', token: '${{ secrets.SOURCE_TOKEN }}' }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: Web files and Android project
        working-directory: mobile
        run: |
          (cd .. && npm ci --ignore-scripts)
          npm ci
          npm run sync
      - name: Signing key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ]; then echo "::error::ANDROID_KEYSTORE secret is missing"; exit 1; fi
          echo "$ANDROID_KEYSTORE" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/scribble-release.keystore"
      - name: Build APK
        working-directory: mobile/android
        env:
          SCRIBBLE_KEYSTORE: ${{ runner.temp }}/scribble-release.keystore
          SCRIBBLE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          V: ${{ needs.plan.outputs.version }}
        run: |
          set -e
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Scribble-$V.apk"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Scribble-Android.apk"
          # must be signed with the release key, or it won't install over earlier versions (and Google sign-in fails)
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$RUNNER_TEMP/Scribble-$V.apk" | tee certs.txt
          grep -qi "54:E7:C3:96:BF:F2:92:98:FD:E1:97:17:57:3A:A3:85:20:C4:6C:0C\|54e7c396bff29298fde19717573aa38520c46c0c" certs.txt || { echo "::error::APK is not signed with the Scribble release key"; exit 1; }
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.plan.outputs.version }}
          R: ${{ github.repository }}
        run: |
          set -e
          gh release view "v$V" --repo "$R" >/dev/null 2>&1 || { echo "::error::Release v$V does not exist yet"; exit 1; }
          for f in "$RUNNER_TEMP/Scribble-$V.apk" "$RUNNER_TEMP/Scribble-Android.apk"; do
            ok=0
            for try in 1 2 3 4 5; do
              if gh release upload "v$V" "$f" --repo "$R" --clobber; then ok=1; break; fi
              echo "upload of $f failed (try $try), retrying…"; sleep $((try * 15))
            done
            [ $ok = 1 ] || { echo "::error::Could not upload $f"; exit 1; }
          done

  # the web version: /app/ from main, /app-beta/ from dev
  web:
    needs: [plan, windows]
    if: always() && (needs.plan.outputs.web == 'true' || needs.plan.outputs.beta == 'true') && needs.windows.result != 'failure' && needs.windows.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { path: site }
      - name: Build and publish
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          WEB: ${{ needs.plan.outputs.web }}
          BETA: ${{ needs.plan.outputs.beta }}
          MAIN_SHA: ${{ needs.plan.outputs.main_sha }}
          DEV_SHA: ${{ needs.plan.outputs.dev_sha }}
        run: |
          set -e
          build() {   # build <sha> <folder>
            rm -rf src && git clone -q "https://x-access-token:${SOURCE_TOKEN}@github.com/${SOURCE_REPO}.git" src
            (cd src && git checkout -q "$1" && npm ci --ignore-scripts && cd mobile && npm ci && node scripts/build-web.js)
            rm -rf "site/$2" && mkdir -p "site/$2" && cp -r src/mobile/web-dist/. "site/$2/" && echo "$1" > "site/$2/.source-sha"
          }
          [ "$WEB" = true ] && build "$MAIN_SHA" app
          [ "$BETA" = true ] && build "$DEV_SHA" app-beta
          cd site
          git config user.name "Scribble release"; git config user.email "release@users.noreply.github.com"
          git add -A app app-beta
          if git diff --cached --quiet; then echo "web versions unchanged"; exit 0; fi
          git commit -qm "Web version (app ${MAIN_SHA::7}, app-beta ${DEV_SHA::7})"
          ok=0
          for try in 1 2 3; do if git push; then ok=1; break; fi; sleep 10; git pull --rebase; done
          [ $ok = 1 ]
